[package]
name = "cable-mixer"
version = "0.1.2"
edition = "2021"
description = "Larger VR-friendly UI with green/red mute buttons"
license = "MIT OR Apache-2.0"

[dependencies]
wasapi = "0.27"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
sysinfo = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
