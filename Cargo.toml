[package]
name = "cable-mixer"
version = "0.1.0"
edition = "2021"
description = "Mix one microphone and one program's audio into VB-Cable as a virtual mic"
license = "MIT OR Apache-2.0"

[dependencies]
wasapi = "0.27"
eframe = "0.37"
sysinfo = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
